name: CI / Deploy

# すべての push と PR で「lint・型チェック・全演習と API の検証・ビルド・E2E」を行い、
# main ブランチへの push のときだけ Cloudflare Workers に公開する。
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  WRANGLER_SEND_METRICS: false

jobs:
  verify:
    name: Lint / Typecheck / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # 全演習の「模範解答はテストに通る・初期コードは通らない」と、Worker の API (ログイン・進捗保存) を検証する
      - run: npm test

  build:
    name: Build + E2E
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Cloudflare Workers ではサイトのルート (/) で配信するので、ベースパスは付けない
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # 実ブラウザで「演習を実行して採点される」ところまで確認する
      - run: npm run e2e
      # ローカルの Workers 環境 (wrangler dev + D1) で、ログインと進捗の同期を確認する
      - run: npm run e2e:cloudflare
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            playwright-report-cloudflare
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: out
          retention-days: 3

  deploy:
    name: Deploy to Cloudflare Workers
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: cloudflare
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が未設定のため、デプロイをスキップしました (README の手順を参照)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.check.outputs.skip != 'true'
      - uses: actions/setup-node@v7
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.check.outputs.skip != 'true'
      - uses: actions/download-artifact@v8
        if: steps.check.outputs.skip != 'true'
        with:
          name: site
          path: out
      # データベースの構造 (テーブル) を最新にする。適用済みのものは飛ばされる
      - run: npx wrangler d1 migrations apply js-study --remote
        if: steps.check.outputs.skip != 'true'
      - name: Deploy
        id: deploy
        if: steps.check.outputs.skip != 'true'
        env:
          OAUTH_GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          OAUTH_GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
        run: |
          # パイプ (| tee) の途中で wrangler が失敗したら、このステップも失敗にする
          set -o pipefail
          # GitHub ログイン用の Client ID / Secret を、Worker の secret としてデプロイと一緒に登録する
          secrets_file="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          node -e '
            const s = {};
            for (const k of ["OAUTH_GITHUB_CLIENT_ID", "OAUTH_GITHUB_CLIENT_SECRET"]) if (process.env[k]) s[k] = process.env[k];
            require("fs").writeFileSync(process.argv[1], JSON.stringify(s));
          ' "$secrets_file"
          npx wrangler deploy --secrets-file "$secrets_file" | tee "$RUNNER_TEMP/deploy.log"
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1 || true)
          if [ -z "$url" ]; then
            echo "::error::公開 URL (workers.dev) が見つかりません。Cloudflare で workers.dev のサブドメインを登録したか確認してください (README の手順 1)"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
